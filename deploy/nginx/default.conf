# web コンテナ用 nginx。TLS はホスト側 nginx が終端し、X-Forwarded-For を実クライアント IP で上書きして渡す。

# ホスト nginx（Docker ネットワーク経由）から来た X-Forwarded-For だけを信用する
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Forwarded-For;
real_ip_recursive off;

# 遅い送信で接続を占有する攻撃への備え
client_header_timeout 15s;
client_body_timeout 30s;
send_timeout 30s;

limit_conn_zone $binary_remote_addr zone=tv_conn:10m;
limit_req_zone $binary_remote_addr zone=tv_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=tv_upload:10m rate=6r/m;
limit_conn_status 429;
limit_req_status 429;

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # api コンテナの再作成で IP が変わっても追従する
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;

    client_max_body_size 10m;
    server_tokens off;
    limit_conn tv_conn 30;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA
    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # 文字起こし用の ONNX Runtime（配信者のブラウザだけが読む）
    location /ort/ {
        types {
            text/javascript  mjs;
            application/wasm wasm;
        }
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 変換済み音声（ファイル名が UUID なので長期キャッシュ可）。Range は静的配信で自動対応。
    location /audio/public/ {
        alias /data/audio/public/;
        types {
            audio/mp4  m4a;
            audio/webm webm;
            audio/ogg  ogg;
        }
        default_type application/octet-stream;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 原本は外に出さない
    location /audio/ {
        return 404;
    }

    # SSE（オーバーレイ・ダッシュボード）
    location ~ ^/api/(overlay/|streamer/events) {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # 投稿（multipart）は回数を絞る
    location ~ ^/api/(topics/[^/]+/threads|threads/[^/]+/posts)$ {
        limit_req zone=tv_upload burst=10 nodelay;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=tv_api burst=40 nodelay;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # 共有 URL（OGP 付き HTML）
    location /s/ {
        limit_req zone=tv_api burst=40 nodelay;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
